<!doctype html><html><head><style>body{margin:0;background:#20242a}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const D='data/';
const loadImg=(u)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
window.THREE=THREE;

async function main(opts){
  const inter = await (await fetch('inter.json')).json();
  window.inter=inter;
  // skeleton
  const bones = inter.bones.map(b=>{const o=new THREE.Bone();o.name=b.name.replace(/\./g,'_');return o});
  inter.bones.forEach((b,i)=>{
    const p=b.parent>=0?inter.bones[b.parent].head:[0,0,0];
    bones[i].position.set(b.head[0]-p[0],b.head[1]-p[1],b.head[2]-p[2]);
    if(b.parent>=0) bones[b.parent].add(bones[i]);
  });
  const root=bones[0];
  const group=new THREE.Group(); group.name='uma';
  group.add(root); group.updateMatrixWorld(true);
  const skeleton=new THREE.Skeleton(bones);
  const tex = await opts.textures(inter);
  const meshes={};
  for(const m of inter.meshes){
    if(opts.skip && opts.skip.includes(m.name)) continue;
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(m.position,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(m.uv,2));
    g.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(m.skinIndex,4));
    g.setAttribute('skinWeight',new THREE.Float32BufferAttribute(m.skinWeight,4));
    g.setIndex(m.index);
    if(opts.editGeo) opts.editGeo(m,g);
    g.computeVertexNormals();
    const mat=tex[m.name]; if(!mat) continue;
    const sm=new THREE.SkinnedMesh(g,mat); sm.name=m.name; sm.castShadow=true; sm.receiveShadow=true;
    sm.bind(skeleton, new THREE.Matrix4());
    group.add(sm); meshes[m.name]=sm;
  }
  return {group,skeleton,bones,meshes};
}
window.main=main;

window.stage=(w,h)=>{
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(w,h);
  r.toneMapping=THREE.NeutralToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.appendChild(r.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a2f38);
  const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.55;
  const key=new THREE.DirectionalLight(0xfff1e0,2.2);key.position.set(1.5,2.5,2.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-0.0004;key.shadow.normalBias=0.01;
  const ks=key.shadow.camera;ks.left=ks.bottom=-1.2;ks.right=ks.top=1.2;scene.add(key);
  const rim=new THREE.DirectionalLight(0xbcd4ff,1.2);rim.position.set(-2,1.5,-2);scene.add(rim);
  const cam=new THREE.PerspectiveCamera(26,w/h,0.05,20);
  return {r,scene,cam};
};
window.ready=true;
</script></body></html>
