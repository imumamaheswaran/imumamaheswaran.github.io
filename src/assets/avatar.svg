<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 320 410" width="320" height="410" class="toon-svg">
<style>.tu-acc{display:none}</style>
<g transform="translate(60 60)">
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- neck: short and solid, in shadow under the jaw -->
  <path d="M76 150 C78 172 76 186 68 196 L132 196 C124 186 122 172 124 150 Z" fill="#9c6446"/>
  <!-- ears -->
  <path d="M56 106 C45 101 42 117 45 126 C47 133 53 136 58 133 Z" fill="#b77e5c"/>
  <path d="M144 106 C155 101 158 117 155 126 C153 133 147 136 142 133 Z" fill="#b77e5c"/>
  <!-- face: round and full, broad cheeks, a soft rounded chin -->
  <path d="M55 98 C54 62 146 62 145 98 C148 112 148 126 144 138 C138 162 122 178 100 180 C78 178 62 162 56 138 C52 126 52 112 55 98 Z" fill="#b77e5c"/>
</g>
<path d="M49 114 C51 118 52 122 51 127 M151 114 C149 118 148 122 149 127" fill="none" stroke="#8a4f30" stroke-width="1.6" stroke-linecap="round"/>
<!-- soft shading on the cheeks and under the jaw -->
<path d="M56 128 C61 154 79 174 100 178 C83 170 68 154 63 132 Z" fill="#9c6446" opacity="0.4"/>
<path d="M144 128 C139 154 121 174 100 178 C117 170 132 154 137 132 Z" fill="#9c6446" opacity="0.4"/>
<!-- warm, full cheeks lifted by the smile -->
<ellipse cx="74" cy="137" rx="10" ry="6" fill="#cc9474" opacity="0.45"/>
<ellipse cx="126" cy="137" rx="10" ry="6" fill="#cc9474" opacity="0.45"/>
<!-- hair: thick, black and wavy, standing up off the forehead and swept
     back and over to the viewer's right, full over the ears -->
<g fill="#16151a" stroke="#0f0d0c" stroke-width="2.6" stroke-linejoin="round">
  <!-- the mass: parted on the viewer's left, rising into a big wave and
       sweeping over to the right, where it falls full over the ear -->
  <path d="M53 116 C46 100 45 80 50 64 C56 44 72 28 92 23 C114 18 138 26 152 42 C162 54 166 70 164 86 C163 98 159 108 154 118 L147 116 C148 104 146 94 141 87 C132 80 120 78 110 80 C100 75 88 75 78 80 C68 85 61 94 58 104 C57 108 57 112 57 116 Z"/>
  <!-- the big wave on top, cresting left of centre and rolling right -->
  <path d="M60 60 C64 36 86 20 108 20 C96 26 88 34 86 44 C76 46 66 52 60 60 Z"/>
  <path d="M86 44 C98 26 126 22 146 34 C132 32 118 36 110 46 C102 43 94 43 86 44 Z"/>
  <path d="M112 46 C130 36 154 44 162 62 C152 54 140 52 132 56 C126 51 120 48 112 46 Z"/>
  <!-- wavy ends on the right, curling down past the temple -->
  <path d="M146 62 C160 66 168 80 166 96 C162 88 156 84 150 84 Z"/>
  <path d="M152 86 C162 94 164 106 160 118 C157 110 153 104 148 102 Z"/>
  <path d="M164 72 C170 76 172 84 170 90 C168 84 164 80 160 79 Z"/>
  <!-- the front lock, lifted off the forehead and swept right -->
  <path d="M62 92 C66 74 84 62 106 61 C126 60 142 68 152 82 C138 73 122 71 108 75 C92 78 76 84 62 92 Z"/>
  <!-- shorter on the left, just over the ear -->
  <path d="M56 72 C47 80 44 92 46 106 C50 98 54 93 59 91 Z"/>
</g>
<!-- sheen and wave lines in the hair -->
<g fill="none" stroke-linecap="round">
  <path d="M68 50 C80 38 98 32 116 33" stroke="#3b3a44" stroke-width="2.2"/>
  <path d="M84 70 C98 64 116 63 134 69" stroke="#3b3a44" stroke-width="1.8"/>
  <path d="M120 40 C136 40 150 48 157 60" stroke="#3b3a44" stroke-width="1.6"/>
  <path d="M152 72 C157 78 159 86 158 94" stroke="#3b3a44" stroke-width="1.4"/>
</g>
<!-- a couple of loose strands at the hairline -->
<g fill="none" stroke="#16151a" stroke-width="1.8" stroke-linecap="round">
  <path d="M110 79 C106 82 104 86 103 90"/>
  <path d="M72 86 C69 90 68 94 69 98"/>
</g>
<!-- eyebrows: thick and fairly straight, a little lifted -->
<path d="M68 101 Q80 95 95 98 L94 102 Q81 99.5 69 105 Z" fill="#14100e"/>
<path d="M132 101 Q120 95 105 98 L106 102 Q119 99.5 131 105 Z" fill="#14100e"/>
<!-- eyes: warm and a little narrowed by the smile, dark brown -->
<g class="eyes">
  <path d="M74 116 Q84 109 94 116 Q84 119.5 74 116 Z" fill="#f4ece2" stroke="#1a1210" stroke-width="1.6"/>
  <path d="M106 116 Q116 109 126 116 Q116 119.5 106 116 Z" fill="#f4ece2" stroke="#1a1210" stroke-width="1.6"/>
  <circle cx="84" cy="115" r="3.6" fill="#3d2414"/>
  <circle cx="116" cy="115" r="3.6" fill="#3d2414"/>
  <circle cx="84" cy="115" r="1.8" fill="#120a06"/>
  <circle cx="116" cy="115" r="1.8" fill="#120a06"/>
  <circle cx="85.3" cy="113.8" r="1" fill="#fff"/>
  <circle cx="117.3" cy="113.8" r="1" fill="#fff"/>
  <path d="M73 115 Q84 107.5 95 115 M105 115 Q116 107.5 127 115" fill="none" stroke="#1a1210" stroke-width="2.6" stroke-linecap="round"/>
  <!-- lower lids pushed up by the smile -->
  <path d="M76 119.5 Q84 122 92 119.5 M108 119.5 Q116 122 124 119.5" fill="none" stroke="#8a4f30" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M76 110.5 Q84 106.5 92 110 M108 110 Q116 106.5 124 110.5" fill="none" stroke="#8a4f30" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g class="tu-acc eyes-closed" fill="none" stroke="#1a1210" stroke-width="2.4" stroke-linecap="round">
  <path d="M74 116 Q84 120 94 116"/><path d="M106 116 Q116 120 126 116"/>
</g>
<!-- nose: broad, with a rounded tip and wide nostrils -->
<path d="M99 113 C98 121 96 126 94 129" fill="none" stroke="#8a4f30" stroke-width="2.2" stroke-linecap="round"/>
<path d="M90 130 C86 132 87 138 92 138 C95 140 98 140 100 139 C102 140 105 140 108 138 C113 138 114 132 110 130" fill="none" stroke="#8a4f30" stroke-width="2.6" stroke-linecap="round"/>
<path d="M93 136 C95 137 97 137 98 136 M102 136 C103 137 105 137 107 136" fill="none" stroke="#5e331f" stroke-width="1.6" stroke-linecap="round"/>
<!-- smile lines -->
<path d="M84 140 C80 145 80 151 83 155 M116 140 C120 145 120 151 117 155" fill="none" stroke="#8a4f30" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
<!-- a warm, closed smile with full lips -->
<g class="mouth-smile">
  <path d="M86 148 Q100 151 114 148 Q112 158 100 159 Q88 158 86 148 Z" fill="#9c5a4c"/>
  <path d="M86 148 Q93 145.5 100 147.5 Q107 145.5 114 148 Q100 151.5 86 148 Z" fill="#7d4238"/>
  <path d="M86 148 Q100 152.5 114 148" fill="none" stroke="#4a221b" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M84.5 146.5 L86.5 148.5 M115.5 146.5 L113.5 148.5" stroke="#4a221b" stroke-width="1.4" stroke-linecap="round"/>
</g>
<g class="tu-acc mouth-sleep">
  <ellipse cx="100" cy="152" rx="4" ry="3" fill="#4a1f1a" stroke="#1a1210" stroke-width="1.6"/>
</g>
<!-- sunglasses (sunny) -->
<g class="tu-acc shades" stroke="#1a1210" stroke-width="2.5" stroke-linejoin="round">
  <path d="M68 106 H96 L94 120 C92 126 72 126 70 120 Z" fill="#11161d"/>
  <path d="M104 106 H132 L130 120 C128 126 108 126 106 120 Z" fill="#11161d"/>
  <path d="M96 109 Q100 106 104 109" fill="none"/>
  <path d="M68 107 L58 110 M132 107 L142 110" fill="none"/>
  <path d="M73 110 L80 110 M109 110 L116 110" stroke="#5fb3ff" stroke-width="2" opacity="0.8"/>
</g>
<!-- a bead of sweat (hot days) -->
<path class="tu-acc sweat" d="M136 112 C132 119 132 124 136 124 C140 124 140 119 136 112 Z" fill="#7cc4ff" stroke="#1a1210" stroke-width="1.5"/>
</g>

<!-- The dobok, down to the hips: the jacket, the arms hanging at the sides,
     and the black belt tied at the hip, across the body between the arms. -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- jacket: shoulders to hips, a little in at the waist -->
  <path d="M124 252 C104 255 84 260 72 270 C62 280 60 300 64 330 C68 360 74 390 80 410 L80 460 L240 460 L240 410 C246 390 252 360 256 330 C260 300 258 280 248 270 C236 260 216 255 196 252 Z" fill="#f7f7f4"/>
  <!-- skin in the V of the collar -->
  <path d="M136 251 L160 318 L184 251 Z" fill="#9c6446"/>
</g>
<!-- shading down the far side -->
<path d="M248 270 C258 280 260 300 256 330 C252 360 246 390 240 410 L240 460 L226 460 C230 420 236 360 240 320 C242 296 244 282 248 270 Z" fill="#1a1210" opacity="0.07"/>
<!-- folds in the cloth -->
<g fill="none" stroke="#c9c9c2" stroke-width="2.2" stroke-linecap="round">
  <path d="M94 300 C106 312 120 316 132 316"/>
  <path d="M226 300 C214 312 200 316 188 316"/>
  <path d="M96 356 C108 362 122 364 136 363"/>
  <path d="M98 390 C112 395 126 396 140 395 M222 390 C210 395 198 396 184 395"/>
  <path d="M100 440 C108 446 118 450 128 451"/>
</g>
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- black collar: the right lapel under, the left lapel crossing over -->
  <path d="M196 252 L210 255 L170 340 L160 334 Z" fill="#141518"/>
  <path d="M124 252 L110 255 L158 348 L170 340 L160 318 Z" fill="#141518"/>
  <!-- the wrap's edge, running down to the belt -->
  <path d="M166 344 L204 402" fill="none"/>
</g>
<!-- black belt at the hip: band across the body, square knot, tails -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round">
  <path d="M78 398 Q160 410 242 398 L242 418 Q160 430 78 418 Z" fill="#141518"/>
  <path d="M150 422 L170 422 L156 460 L134 458 Z" fill="#141518"/>
  <path d="M152 422 L172 422 L188 458 L166 460 Z" fill="#141518"/>
  <path d="M147 399 Q160 397 173 399 L175 424 Q160 427 145 424 Z" fill="#1d1f23"/>
  <path d="M146 408 L160 398 L175 416 L171 425 Z" fill="#26282d"/>
</g>
<path d="M82 404 Q120 411 144 412 M176 412 Q200 411 238 404 M82 413 Q120 420 144 421 M176 421 Q200 420 238 413" fill="none" stroke="#3a3d44" stroke-width="1" stroke-linecap="round"/>
<!-- gold embroidery on the belt -->
<path d="M92 409 Q112 413 132 414" fill="none" stroke="#d8b45e" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
<!-- arms, hanging at the sides in front of the belt's ends -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <path d="M72 268 C54 272 42 286 38 306 C34 340 32 380 34 418 L66 420 C68 384 72 344 76 314 C78 296 78 280 72 268 Z" fill="#f7f7f4"/>
  <path d="M248 268 C266 272 278 286 282 306 C286 340 288 380 286 418 L254 420 C252 384 248 344 244 314 C242 296 242 280 248 268 Z" fill="#f7f7f4"/>
  <!-- hands -->
  <path d="M37 419 C34 433 38 447 50 449 C61 449 67 439 65 421 Z" fill="#b77e5c"/>
  <path d="M283 419 C286 433 282 447 270 449 C259 449 253 439 255 421 Z" fill="#b77e5c"/>
</g>
<g fill="none" stroke="#c9c9c2" stroke-width="2" stroke-linecap="round">
  <path d="M44 330 C50 334 58 334 66 331 M276 330 C270 334 262 334 254 331"/>
  <path d="M40 376 C47 380 56 380 66 377 M280 376 C273 380 264 380 254 377"/>
</g>
<path d="M37 410 L66 412 M283 410 L254 412" fill="none" stroke="#1a1210" stroke-width="2" stroke-linecap="round"/>
<!-- flag patch on the chest -->
<g transform="translate(224 302) rotate(-33.7)">
  <circle r="11" fill="#fff" stroke="#1a1210" stroke-width="1.5"/>
  <circle r="9" fill="#0047a0"/>
  <path d="M-9 0A9 9 0 0 1 9 0A4.5 4.5 0 0 1 0 0A4.5 4.5 0 0 0 -9 0Z" fill="#cd2e3a"/>
</g>

</svg>