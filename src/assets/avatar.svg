<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 320 410" width="320" height="410" class="toon-svg">
<style>.tu-acc{display:none}</style>
<g transform="translate(60 60)">
<defs>
  <!-- stubble: a fine stipple, like the short beard in the portrait -->
  <pattern id="toon-stubble" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
    <circle cx="0.8" cy="0.8" r="0.45" fill="#1a1210"/>
    <circle cx="2.4" cy="2.3" r="0.4" fill="#1a1210"/>
  </pattern>
</defs>
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- neck, in shadow under the jaw -->
  <path d="M80 148 C81 170 79 186 72 196 L128 196 C121 186 119 170 120 148 Z" fill="#a8653a"/>
  <!-- ears -->
  <path d="M59 108 C49 104 47 118 50 126 C52 132 57 134 61 132 Z" fill="#c27c4c"/>
  <path d="M141 108 C151 104 153 118 150 126 C148 132 143 134 139 132 Z" fill="#c27c4c"/>
  <!-- face: an oval with a defined jaw -->
  <path d="M60 94 C60 64 140 64 140 94 L140 122 C139 150 122 174 100 177 C78 174 61 150 60 122 Z" fill="#c27c4c"/>
</g>
<path d="M53 116 C55 119 56 123 55 127 M147 116 C145 119 144 123 145 127" fill="none" stroke="#8a4e2a" stroke-width="1.6" stroke-linecap="round"/>
<!-- soft shading on the cheeks and under the jaw -->
<path d="M61 124 C64 148 80 170 100 175 C84 166 70 150 66 128 Z" fill="#a8653a" opacity="0.35"/>
<path d="M139 124 C136 148 120 170 100 175 C116 166 130 150 134 128 Z" fill="#a8653a" opacity="0.35"/>
<!-- short stubble beard along the jaw and chin, joined to the moustache -->
<path d="M61 120 C62 150 80 175 100 177 C120 175 138 150 139 120 C135 138 128 148 121 150 C114 147 107 148 100 149 C93 148 86 147 79 150 C72 148 65 138 61 120 Z" fill="url(#toon-stubble)" opacity="0.55"/>
<path d="M61 120 C62 150 80 175 100 177 C120 175 138 150 139 120 C135 138 128 148 121 150 C114 147 107 148 100 149 C93 148 86 147 79 150 C72 148 65 138 61 120 Z" fill="#1a1210" opacity="0.14"/>
<path d="M88 158 C92 170 108 170 112 158 C106 162 94 162 88 158 Z" fill="#1a1210" opacity="0.25"/>
<!-- hair: a low base with a high hairline, then long locks layered over it,
     each pointing the way the hair falls: swept to the viewer's left on top,
     hanging and flicking outward at the sides -->
<g fill="#1c1a1d" stroke="#1a1210" stroke-width="2.6" stroke-linejoin="round">
  <path d="M58 112 C52 96 50 78 56 64 C64 48 82 40 102 39 C124 38 146 46 156 62 C162 74 160 94 152 112 L146 112 C146 100 142 92 136 86 C124 80 112 78 100 79 C88 80 76 83 68 89 C63 95 61 104 60 112 Z"/>
  <!-- right side: locks curling down and out -->
  <path d="M146 54 C160 58 168 70 168 84 C162 75 155 70 146 68 Z"/>
  <path d="M150 76 C161 82 166 95 162 109 C158 99 153 93 146 90 Z"/>
  <!-- crown, sweeping left -->
  <path d="M152 52 C142 38 124 33 108 35 C124 40 136 47 142 58 Z"/>
  <path d="M134 40 C114 29 88 30 68 42 C86 39 104 41 120 48 Z"/>
  <!-- left side: locks swept left and down -->
  <path d="M74 48 C58 48 45 57 40 72 C49 64 60 60 72 60 Z"/>
  <path d="M62 66 C49 70 42 83 42 97 C48 87 55 81 63 79 Z"/>
  <path d="M61 84 C53 90 48 101 50 113 C54 104 58 98 63 96 Z"/>
</g>
<!-- silver streaks on the left side, as in the portrait -->
<g fill="none" stroke-linecap="round">
  <path d="M124 41 C104 41 80 48 62 62" stroke="#8d929b" stroke-width="2.8"/>
  <path d="M114 50 C96 53 76 60 60 74" stroke="#b8bdc5" stroke-width="2"/>
  <path d="M90 42 C78 45 64 52 54 62" stroke="#b8bdc5" stroke-width="1.5"/>
</g>
<!-- a couple of loose strands at the hairline -->
<g fill="none" stroke="#1c1a1d" stroke-width="1.8" stroke-linecap="round">
  <path d="M104 79 C98 82 95 86 93 91"/>
  <path d="M78 83 C74 88 73 93 74 97"/>
</g>
<!-- eyebrows: thick, slightly arched -->
<path d="M70 100 Q81 92 95 97 L94 102 Q82 98 71 105 Z" fill="#1a1210"/>
<path d="M130 100 Q119 92 105 97 L106 102 Q118 98 129 105 Z" fill="#1a1210"/>
<!-- eyes: almond, dark brown, with a crease above -->
<g class="eyes">
  <path d="M75 115 Q84 108 93 115 Q84 120 75 115 Z" fill="#f6efe6" stroke="#1a1210" stroke-width="1.6"/>
  <path d="M107 115 Q116 108 125 115 Q116 120 107 115 Z" fill="#f6efe6" stroke="#1a1210" stroke-width="1.6"/>
  <circle cx="84" cy="114.5" r="3.7" fill="#4a2a18"/>
  <circle cx="116" cy="114.5" r="3.7" fill="#4a2a18"/>
  <circle cx="84" cy="114.5" r="1.8" fill="#140c08"/>
  <circle cx="116" cy="114.5" r="1.8" fill="#140c08"/>
  <circle cx="85.3" cy="113.2" r="1" fill="#fff"/>
  <circle cx="117.3" cy="113.2" r="1" fill="#fff"/>
  <path d="M74 114 Q84 106.5 94 114 M106 114 Q116 106.5 126 114" fill="none" stroke="#1a1210" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M77 109.5 Q84 105.5 91 109 M109 109 Q116 105.5 123 109.5" fill="none" stroke="#8a4e2a" stroke-width="1.3" stroke-linecap="round"/>
</g>
<g class="tu-acc eyes-closed" fill="none" stroke="#1a1210" stroke-width="2.4" stroke-linecap="round">
  <path d="M75 115 Q84 119 93 115"/><path d="M107 115 Q116 119 125 115"/>
</g>
<!-- nose: straight, with a rounded tip -->
<path d="M99 112 C98 121 95 126 94 130 C93 134 97 136 100 136 C103 136 107 134 106 130" fill="none" stroke="#8a4e2a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M93 131 C91 133 92 135 95 135 M107 131 C109 133 108 135 105 135" fill="none" stroke="#8a4e2a" stroke-width="1.6" stroke-linecap="round"/>
<!-- moustache -->
<path d="M83 142 C89 137 96 137 100 139.5 C104 137 111 137 117 142 C113 143.5 108 143 104 142.5 C102 142.3 101 143 100 143.5 C99 143 98 142.3 96 142.5 C92 143 87 143.5 83 142 Z" fill="#1a1210"/>
<!-- a gentle, closed smile -->
<g class="mouth-smile">
  <path d="M90 150 Q100 156.5 110 150 Q100 152.5 90 150 Z" fill="#b06f5c"/>
  <path d="M89 148.5 Q95 147 100 148.5 Q105 147 111 148.5 Q100 152.5 89 148.5 Z" fill="#8f4f43"/>
</g>
<g class="tu-acc mouth-sleep">
  <ellipse cx="100" cy="151" rx="4" ry="3" fill="#4a1f1a" stroke="#1a1210" stroke-width="1.6"/>
</g>
<!-- sunglasses (sunny) -->
<g class="tu-acc shades" stroke="#1a1210" stroke-width="2.5" stroke-linejoin="round">
  <path d="M68 106 H96 L94 120 C92 126 72 126 70 120 Z" fill="#11161d"/>
  <path d="M104 106 H132 L130 120 C128 126 108 126 106 120 Z" fill="#11161d"/>
  <path d="M96 109 Q100 106 104 109" fill="none"/>
  <path d="M68 107 L58 110 M132 107 L142 110" fill="none"/>
  <path d="M73 110 L80 110 M109 110 L116 110" stroke="#5fb3ff" stroke-width="2" opacity="0.8"/>
</g>
<!-- a bead of sweat (hot days) -->
<path class="tu-acc sweat" d="M136 112 C132 119 132 124 136 124 C140 124 140 119 136 112 Z" fill="#7cc4ff" stroke="#1a1210" stroke-width="1.5"/>
</g>

<!-- The dobok, down to the hips: the jacket, the arms hanging at the sides,
     and the black belt tied at the hip, across the body between the arms. -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- jacket: shoulders to hips, a little in at the waist -->
  <path d="M124 252 C104 255 84 260 72 270 C62 280 60 300 64 330 C68 360 74 390 80 410 L80 460 L240 460 L240 410 C246 390 252 360 256 330 C260 300 258 280 248 270 C236 260 216 255 196 252 Z" fill="#f7f7f4"/>
  <!-- skin in the V of the collar -->
  <path d="M138 251 L160 318 L182 251 Z" fill="#a8653a"/>
</g>
<!-- shading down the far side -->
<path d="M248 270 C258 280 260 300 256 330 C252 360 246 390 240 410 L240 460 L226 460 C230 420 236 360 240 320 C242 296 244 282 248 270 Z" fill="#1a1210" opacity="0.07"/>
<!-- folds in the cloth -->
<g fill="none" stroke="#c9c9c2" stroke-width="2.2" stroke-linecap="round">
  <path d="M94 300 C106 312 120 316 132 316"/>
  <path d="M226 300 C214 312 200 316 188 316"/>
  <path d="M96 356 C108 362 122 364 136 363"/>
  <path d="M98 390 C112 395 126 396 140 395 M222 390 C210 395 198 396 184 395"/>
  <path d="M100 440 C108 446 118 450 128 451"/>
</g>
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- black collar: the right lapel under, the left lapel crossing over -->
  <path d="M196 252 L210 255 L170 340 L160 334 Z" fill="#141518"/>
  <path d="M124 252 L110 255 L158 348 L170 340 L160 318 Z" fill="#141518"/>
  <!-- the wrap's edge, running down to the belt -->
  <path d="M166 344 L204 402" fill="none"/>
</g>
<!-- black belt at the hip: band across the body, square knot, tails -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round">
  <path d="M78 398 Q160 410 242 398 L242 418 Q160 430 78 418 Z" fill="#141518"/>
  <path d="M150 422 L170 422 L156 460 L134 458 Z" fill="#141518"/>
  <path d="M152 422 L172 422 L188 458 L166 460 Z" fill="#141518"/>
  <path d="M147 399 Q160 397 173 399 L175 424 Q160 427 145 424 Z" fill="#1d1f23"/>
  <path d="M146 408 L160 398 L175 416 L171 425 Z" fill="#26282d"/>
</g>
<path d="M82 404 Q120 411 144 412 M176 412 Q200 411 238 404 M82 413 Q120 420 144 421 M176 421 Q200 420 238 413" fill="none" stroke="#3a3d44" stroke-width="1" stroke-linecap="round"/>
<!-- gold embroidery on the belt -->
<path d="M92 409 Q112 413 132 414" fill="none" stroke="#d8b45e" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
<!-- arms, hanging at the sides in front of the belt's ends -->
<g stroke="#1a1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <path d="M72 268 C54 272 42 286 38 306 C34 340 32 380 34 418 L66 420 C68 384 72 344 76 314 C78 296 78 280 72 268 Z" fill="#f7f7f4"/>
  <path d="M248 268 C266 272 278 286 282 306 C286 340 288 380 286 418 L254 420 C252 384 248 344 244 314 C242 296 242 280 248 268 Z" fill="#f7f7f4"/>
  <!-- hands -->
  <path d="M37 419 C34 433 38 447 50 449 C61 449 67 439 65 421 Z" fill="#c27c4c"/>
  <path d="M283 419 C286 433 282 447 270 449 C259 449 253 439 255 421 Z" fill="#c27c4c"/>
</g>
<g fill="none" stroke="#c9c9c2" stroke-width="2" stroke-linecap="round">
  <path d="M44 330 C50 334 58 334 66 331 M276 330 C270 334 262 334 254 331"/>
  <path d="M40 376 C47 380 56 380 66 377 M280 376 C273 380 264 380 254 377"/>
</g>
<path d="M37 410 L66 412 M283 410 L254 412" fill="none" stroke="#1a1210" stroke-width="2" stroke-linecap="round"/>
<!-- flag patch on the chest -->
<g transform="translate(224 302) rotate(-33.7)">
  <circle r="11" fill="#fff" stroke="#1a1210" stroke-width="1.5"/>
  <circle r="9" fill="#0047a0"/>
  <path d="M-9 0A9 9 0 0 1 9 0A4.5 4.5 0 0 1 0 0A4.5 4.5 0 0 0 -9 0Z" fill="#cd2e3a"/>
</g>

</svg>